# Redis 7 小内存优化配置（适用于 2G 内存服务器）
# 参考内存占用：约 10-20MB

# 最大内存限制
maxmemory 32mb

# 内存淘汰策略：优先淘汰最近最少使用的 key
maxmemory-policy allkeys-lru

# AOF 持久化（生产环境建议开启）
appendonly yes
appendfsync everysec

# 禁用 RDB 快照以节省内存（个人博客数据量小，AOF 足够）
save ""

# 关闭客户端超时（0 表示永不超时）
timeout 0

# 最大客户端连接数
maxclients 32

# 关闭部分命令以节省内存
# 不需要的功能可以注释掉

# 慢查询日志（仅记录超过 10ms 的命令）
slowlog-log-slower-than 10000
slowlog-max-len 32
