version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: wutao-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: WuTao
      MYSQL_USER: wutao
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d  # 初始化SQL脚本
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro  # 小内存优化配置
    ports:
      - "3306:3306"
    networks:
      - wutao-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: wutao-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - wutao-network
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro  # 小内存优化配置
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端Java应用
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 是否构建AI摘要模块（true 时镜像包含 langchain4j 与 AI 模块，包体增大；默认关闭）
        AI_ENABLED: ${AI_ENABLED:-false}
    container_name: wutao-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
      # 数据库配置
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: WuTao
      MYSQL_USER: wutao
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      # Redis配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: 0
      # JWT配置
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_TTL: ${JWT_TTL:-86400000}
      # 阿里云OSS配置
      ALIOSS_ENDPOINT: ${ALIOSS_ENDPOINT}
      ALIOSS_ACCESS_KEY_ID: ${ALIOSS_ACCESS_KEY_ID:?ALIOSS_ACCESS_KEY_ID is required}
      ALIOSS_ACCESS_KEY_SECRET: ${ALIOSS_ACCESS_KEY_SECRET:?ALIOSS_ACCESS_KEY_SECRET is required}
      ALIOSS_BUCKET_NAME: ${ALIOSS_BUCKET_NAME}
      # 邮件配置
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      EMAIL_PERSONAL: ${EMAIL_PERSONAL}
      EMAIL_FROM: ${EMAIL_FROM}
      # 访客验证码
      VISITOR_VERIFY_CODE: ${VISITOR_VERIFY_CODE:?VISITOR_VERIFY_CODE is required}
      # 网站配置
      WEBSITE_TITLE: ${WEBSITE_TITLE}
      WEBSITE_HOME: ${WEBSITE_HOME}
      WEBSITE_ADMIN: ${WEBSITE_ADMIN}
      WEBSITE_CV: ${WEBSITE_CV}
      WEBSITE_BLOG: ${WEBSITE_BLOG}
      # AI摘要模块配置（需构建镜像时 AI_ENABLED=true 才打包该模块；秘钥通过 .env 注入，勿写死在 compose 中）
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-deepseek-chat}
    ports:
      - "5922:5922"
    networks:
      - wutao-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./docker/app/logs:/app/logs

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: wutao-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - wutao-network
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./docker/html:/var/www:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
  redis_data:
  nginx_logs:

networks:
  wutao-network:
    driver: bridge
